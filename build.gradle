plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.3'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'jacoco' // 테스트 커버리지를 위한 jacoco
}

// 테스트 커버리지용
test {
  finalizedBy jacocoTestReport
}

jacocoTestReport {
  dependsOn test
  reports {
    xml.required = true
    html.required = true
  }

  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: [
              'com/part4/team09/otboo/config/**',
              'com/part4/team09/otboo/module/common/exception/**',
              'com/part4/team09/otboo/module/common/dto/**',
              'com/part4/team09/otboo/module/common/enums/**',
              'com/part4/team09/otboo/module/common/monitoring/**',
              'com/part4/team09/otboo/OtbooApplication.class',
              'com/part4/team09/otboo/module/domain/**/dto/**',
              'com/part4/team09/otboo/module/domain/**/entity/**',
              'com/part4/team09/otboo/module/domain/**/mapper/**',
              'com/part4/team09/otboo/module/domain/**/assembler/**',
              'com/part4/team09/otboo/module/domain/**/exception/**',
              'com/part4/team09/otboo/module/domain/notification/event/*Event.class',
              'com/part4/team09/otboo/module/domain/weather/batch/listener/**',
              'com/part4/team09/otboo/module/domain/weather/batch/retry/*Launcher.class',
              'com/part4/team09/otboo/module/domain/weather/batch/*Launcher.class',
              'com/part4/team09/otboo/module/domain/**/Q*.class'
      ])
    }))
  }

  dependsOn test
}

group = 'com.part4.team09'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
  testCompileOnly {
    extendsFrom testAnnotationProcessor
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-cache'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-batch'
  implementation 'org.springframework.boot:spring-boot-starter-mail'
  implementation("org.springframework.boot:spring-boot-starter-oauth2-client")

  implementation 'org.springframework.boot:spring-boot-starter-data-redis'

  implementation 'com.nimbusds:nimbus-jose-jwt:10.3'

  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

  implementation 'software.amazon.awssdk:s3:2.31.7'

  implementation 'io.micrometer:micrometer-registry-prometheus'
  implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

//  implementation 'org.springframework.retry:spring-retry'

  // Kafka
  implementation 'org.springframework.kafka:spring-kafka'

  // DB
  runtimeOnly 'org.postgresql:postgresql'

  // Lombok
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  // Mapstruct
  implementation 'org.mapstruct:mapstruct:1.6.3'
  annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

  // Lombok, Mapstruct 연동(mapsturct 빌드 시 lombok과 충돌 이슈 해결)
  implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
  annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

  // QueryDSL
  implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
  annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
  annotationProcessor "jakarta.annotation:jakarta.annotation-api"
  annotationProcessor "jakarta.persistence:jakarta.persistence-api"

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'org.springframework.batch:spring-batch-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testImplementation 'com.h2database:h2'

  // WebSocket
  implementation 'org.springframework.boot:spring-boot-starter-websocket'

  // Shedlock
  implementation 'net.javacrumbs.shedlock:shedlock-spring:6.3.0'
  implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.3.0'

  // HTML 파싱
  implementation 'org.jsoup:jsoup:1.17.2'
}

tasks.named('test') {
  useJUnitPlatform()
}
