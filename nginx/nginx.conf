events {}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # EC2 인스턴스 2대
  upstream backend {
    server ec2-43-202-163-174.ap-northeast-2.compute.amazonaws.com:8080;
    server ec2-3-36-11-211.ap-northeast-2.compute.amazonaws.com:8080;
  }

  server {
    listen 80;

    # 모든 요청을 백엔드로 프록시
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;:
    }
  }
}
