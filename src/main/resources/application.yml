spring:
  application:
    name: otboo
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        #        highlight_sql: true
        #        use_sql_comments: true
        format_sql: true
    open-in-view: false
  batch:
    job:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    cache-names:
      - followSummary
      - comments
      - feeds
    redis:
      enable-statistics: true          # size, TTL은 cacheConfig에서 지정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dummy}
    password: ${MAIL_PASSWORD:dummy_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

otboo:
  admin:
    name: ${ADMIN_NAME:admin}
    email: ${ADMIN_EMAIL:admin@admin.com}
    password: ${ADMIN_PASSWORD:admin1234}
  file:
    storage:
      type: ${FILE_STORAGE_TYPE:local}
      path: ${FILE_STORAGE_PATH:${user.dir}/fileStorage}
  resource:
    path: files

jwt:
  issuer: otboo
  access-token:
    validity-seconds: 900 # 15분
  refresh-token:
    validity-seconds: 2592000 # 30일
  secret: ${JWT_SECRET:dev-jwt-secret-key-must-be-at-least-32-characters-long}

# ?? ?? ??
logging:
  level:
    root: info
#    org.hibernate.SQL: debug // p6spy로 대신 로깅

# ?????
management:
  endpoints:
    web:
      exposure:
        include: info, health, metrics, loggers
  info:
    env:
      enabled: true
