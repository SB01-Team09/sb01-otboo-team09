spring:
  application:
    name: otboo
  profiles:
    active: ${SPRING_PROFILE:dev} # 환경변수에 설정되어 있는 값으로 덮어씌워짐. ECS 환경변수에 SPRING_PROFILE=prod로 설정되어 있음
  config:
    import: optional:file:.env[.properties]
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        #        highlight_sql: true
        #        use_sql_comments: true
        format_sql: true
    open-in-view: false
  batch:
    job:
      enabled: false
  cache:
    type: redis
    cache-names:
      - followSummary
      - comments
      - feeds
    redis:
      enable-statistics: true          # size, TTL은 cacheConfig에서 지정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: ${OAUTH_REDIRECT_BASE_URL}/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-name: kakao
            scope: profile_nickname, profile_image
        provider:
          google:
            issuer-uri: https://accounts.google.com
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

otboo:
  admin:
    name: ${ADMIN_NAME:admin}
    email: ${ADMIN_EMAIL:admin@admin.com}
    password: ${ADMIN_PASSWORD:admin1234}
  file:
    storage:
      type: ${FILE_STORAGE_TYPE:local}
      local:
        path: ${FILE_STORAGE_PATH:${user.dir}/fileStorage}
      s3:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
        region: ${AWS_S3_REGION}
        bucket: ${AWS_S3_BUCKET}
        image-prefix: ${AWS_S3_IMAGE_PREFIX:images}
  resource:
    path: files
  auth:
    temp-password:
      expiration-seconds: 86400 # 24시간

jwt:
  issuer: otboo
  access-token:
    validity-seconds: 900 # 15분
  refresh-token:
    validity-seconds: 2592000 # 30일
  secret: ${JWT_SECRET:test-jwt-secret-key-for-test-should-be-long-enough}

logging:
  level:
    root: info
#    org.hibernate.SQL: debug // p6spy로 대신 로깅

management:
  endpoints:
    web:
      exposure:
        include: info, health, metrics, loggers
  info:
    env:
      enabled: true

sse:
  timeout: 300_000

