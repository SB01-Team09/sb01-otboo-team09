spring:
  application:
    name: otboo
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        #        highlight_sql: true
        #        use_sql_comments: true
        format_sql: true
    open-in-view: false
  batch:
    job:
      enabled: false
  cache:
    type: redis
    cache-names:
      - followSummary
      - comments
      - feeds
    redis:
      enable-statistics: true          # size, TTL은 cacheConfig에서 지정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dummy}
    password: ${MAIL_PASSWORD:dummy_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_ID}
            client-secret: ${GOOGLE_SECRET}
            scope: profile, email
        provider:
          google:
            issuer-uri: https://accounts.google.com

otboo:
  admin:
    name: ${ADMIN_NAME:admin}
    email: ${ADMIN_EMAIL:admin@admin.com}
    password: ${ADMIN_PASSWORD:admin1234}
  file:
    storage:
      type: ${FILE_STORAGE_TYPE:local}
      local:
        path: ${FILE_STORAGE_PATH:${user.dir}/fileStorage}
      s3:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
        region: ${AWS_S3_REGION}
        bucket: ${AWS_S3_BUCKET}
        image-prefix: ${AWS_S3_IMAGE_PREFIX:images}
  resource:
    path: files
  auth:
    temp-password:
      expiration-seconds: 86400 # 24시간

jwt:
  issuer: otboo
  access-token:
    validity-seconds: 900 # 15분
  refresh-token:
    validity-seconds: 2592000 # 30일
  secret: ${JWT_SECRET:SXX8OdfdoXHTckVkK/0Ec5499hTUEU3qXqbFJcW1BPKg5KyXlu59r0uiIaRl45173KIAKfriIEztNEu1sicQiw==}

logging:
  level:
    root: info
#    org.hibernate.SQL: debug // p6spy로 대신 로깅

management:
  endpoints:
    web:
      exposure:
        include: info, health, metrics, loggers
  info:
    env:
      enabled: true

sse:
  timeout: 300_000

